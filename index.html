<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flappy Pássaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#1d2b33}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#10181d}}
:root[data-theme="dark"]{--bg:#10181d}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none;font-family:"Press Start 2P","Courier New",monospace}
button{font:inherit}
#stage{position:relative}
canvas{display:block;image-rendering:pixelated;width:100%;height:100%;outline:none}
#ov{position:absolute;left:0;top:0;width:360px;height:640px;transform-origin:0 0;pointer-events:none}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.screen button,.panelbox,#msg{pointer-events:auto}
.outl{-webkit-text-stroke:7px #543847;paint-order:stroke fill;text-shadow:0 5px 0 #543847}
.title{position:absolute;top:40px;width:100%;text-align:center;color:#fff;font-size:38px;line-height:1.3}
.btn{position:absolute;width:140px;height:84px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#fff 60%,#dcdcdc 60%);border:4px solid #543847;border-radius:10px;box-shadow:0 4px 0 #543847;cursor:pointer;color:#543847;font-size:16px;padding:0}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #543847}
.tri{width:0;height:0;border-left:30px solid #2a9d4a;border-top:20px solid transparent;border-bottom:20px solid transparent;margin-left:8px}
.acct{position:absolute;left:0;width:100%;top:494px;display:flex;justify-content:center;align-items:center;gap:8px;font-size:9px;color:#fff}
.acct button{background:#ffd23f;border:3px solid #543847;border-radius:8px;padding:9px 10px;font-size:9px;cursor:pointer;color:#543847}
#who{-webkit-text-stroke:4px #543847;paint-order:stroke fill}
.gotitle{position:absolute;top:84px;width:100%;text-align:center;color:#fca044;font-size:30px;-webkit-text-stroke:6px #543847;paint-order:stroke fill;text-shadow:0 4px 0 #543847}
.card{position:absolute;left:50px;top:160px;width:260px;box-sizing:border-box;padding:16px;text-align:center;background:#ded895;border:4px solid #543847;border-radius:10px;box-shadow:0 4px 0 #543847}
.lab{color:#e86101;font-size:11px;margin-top:6px}
.val{color:#fff;font-size:30px;-webkit-text-stroke:5px #543847;paint-order:stroke fill;margin:10px 0}
#ovnew{display:none;position:absolute;top:-16px;right:-12px;background:#e8452f;color:#fff;font-size:10px;padding:6px 8px;border:3px solid #543847;border-radius:6px;transform:rotate(8deg)}
#ovhint{position:absolute;top:498px;width:100%;text-align:center;color:#fff;font-size:8px;line-height:1.6;padding:0 20px;box-sizing:border-box;-webkit-text-stroke:3px #543847;paint-order:stroke fill}
#over.on .gotitle,#over.on .card{animation:rise .35s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(-24px)}to{opacity:1;transform:none}}
#over:not(.armed) button{pointer-events:none}
#panel{display:none;position:absolute;left:30px;top:110px;width:300px;box-sizing:border-box;padding:16px;background:#ded895;border:4px solid #543847;border-radius:10px;box-shadow:0 4px 0 #543847;color:#543847;font-size:11px;z-index:20}
#panel ol{margin:10px 0;padding-left:28px;line-height:2;font-size:10px}
#panel button{background:#ffd23f;border:3px solid #543847;border-radius:8px;padding:9px 12px;font-size:10px;cursor:pointer;color:#543847}
#msg{display:none;position:absolute;top:8px;left:8px;right:8px;padding:8px 10px;background:#b3261e;color:#fff;border-radius:8px;font:500 12px system-ui,sans-serif;z-index:30}
#nickbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;font:500 15px system-ui,sans-serif}
#nickbox .ncard{background:#fff;color:#222;padding:18px;border-radius:12px;width:min(320px,88vw)}
#nickbox p{margin:6px 0 10px;font-size:13px;color:#555}
#nickbox input{width:100%;box-sizing:border-box;padding:9px;font-size:16px;border:2px solid #2b2b2b;border-radius:8px}
#nickbox button{font:inherit;padding:8px 14px;border:2px solid #2b2b2b;border-radius:8px;background:#ffd23f;cursor:pointer;margin:10px 8px 0 0}
#nickerr{color:#b3261e;font-size:13px;margin-top:6px;min-height:16px}
</style></head><body>
<div id="stage">
<canvas id="c" tabindex="0"></canvas>
<div id="ov">
  <div id="msg"></div>

  <div id="menu" class="screen on">
    <div class="title outl">Flappy<br>Pássaro</div>
    <button class="btn" id="playbtn" tabindex="-1" aria-label="Jogar" style="left:32px;top:400px"><span class="tri"></span></button>
    <button class="btn" id="toggle" tabindex="-1" aria-label="Ranking" style="left:188px;top:400px">
      <svg width="64" height="46" viewBox="0 0 64 46" aria-hidden="true">
        <rect x="0" y="22" width="21" height="24" fill="#f8774a"/><rect x="21" y="6" width="22" height="40" fill="#f8774a"/><rect x="43" y="14" width="21" height="32" fill="#f8774a"/>
        <g fill="#fff" font-size="12" text-anchor="middle" font-family="Press Start 2P,monospace"><text x="10" y="40">3</text><text x="32" y="30">1</text><text x="54" y="40">2</text></g>
      </svg>
    </button>
    <div class="acct">
      <span id="who"></span>
      <button id="login" tabindex="-1">Entrar com Google</button>
      <button id="nickbtn" tabindex="-1" style="display:none" title="Mudar apelido">✏️</button>
    </div>
  </div>

  <div id="over" class="screen">
    <div class="gotitle">Game Over</div>
    <div class="card"><div id="ovnew">NOVO!</div>
      <div class="lab">Pontos</div><div class="val" id="ovscore">0</div>
      <div class="lab">Recorde</div><div class="val" id="ovbest">0</div>
    </div>
    <button class="btn" id="again" tabindex="-1" aria-label="Jogar de novo" style="left:32px;top:400px"><span class="tri"></span></button>
    <button class="btn" id="tomenu" tabindex="-1" style="left:188px;top:400px">MENU</button>
    <div id="ovhint"></div>
  </div>

  <div id="panel" class="panelbox"><b>🏆 Top 10</b><ol id="list"></ol><button id="rankclose" tabindex="-1">Fechar</button></div>
</div>
</div>

<div id="nickbox"><div class="ncard"><b>Escolha seu apelido</b>
<p>Ele aparece no ranking público.</p>
<input id="nickin" maxlength="16" autocomplete="off" placeholder="3 a 16 caracteres">
<div id="nickerr"></div><button id="nicksave">Salvar</button><button id="nickcancel">Cancelar</button></div></div>

<script>
const W=360,H=640,GR=96,GAP=150,PW=62,SPD=2.4,GRAV=0.42,FLAP=-7.4;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const stage=$('stage'),ov=$('ov');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);stage.style.width=W*s+'px';stage.style.height=H*s+'px';ov.style.transform='scale('+s+')'}
addEventListener('resize',fit);fit();
const img=new Image();img.src='sprite.png';
let state='menu',bird,pipes,score,best=0,gx=0,spawn=0,deadAt=0,last=0,tick=0,flash=0;
try{best=+localStorage.getItem('fb_best')||0}catch(e){}
function reset(){bird={x:90,y:(H-GR)/2,v:0,w:40,h:28};pipes=[];score=0;spawn=60}
const screens={menu:$('menu'),over:$('over')};
function setScreen(n){for(const k in screens)screens[k].classList.toggle('on',k===n)}
function startGame(){reset();state='ready';setScreen(null)}
function goMenu(){reset();state='menu';setScreen('menu')}
$('playbtn').onclick=startGame;$('again').onclick=startGame;$('tomenu').onclick=goMenu;

function flap(fromKey){
  const now=performance.now();
  if(state==='menu'){if(fromKey)startGame()}
  else if(state==='ready'){state='play';bird.v=FLAP}
  else if(state==='play'){bird.v=FLAP}
  else if(state==='dead'){if(fromKey&&now-deadAt>800)startGame()}
}
const inUI=e=>e.target.closest&&e.target.closest('#ov button,#ov .panelbox,#nickbox');
addEventListener('pointerdown',e=>{
  if(inUI(e))return;
  window.focus();cv.focus();
  if(state==='menu'||state==='dead')return;
  e.preventDefault();flap(false);
});
function onKey(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Space'||e.key===' '||e.code==='ArrowUp'||e.code==='KeyW'){
    e.preventDefault();
    if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
    if(!e.repeat)flap(true);
  }
}
window.addEventListener('keydown',onKey);document.addEventListener('keydown',onKey);
window.focus();cv.focus();

function die(){
  state='dead';deadAt=performance.now();flash=1;
  const isNew=score>best;
  if(isNew){best=score;try{localStorage.setItem('fb_best',best)}catch(e){}}
  if(window.onGameOver)window.onGameOver(score);
  $('ovscore').textContent=score;$('ovbest').textContent=best;
  $('ovnew').style.display=isNew&&score>0?'block':'none';
  $('ovhint').textContent=(window.getNick&&window.getNick())?'':'Entre com Google no menu para salvar seu recorde no ranking';
  setTimeout(()=>{
    if(state!=='dead')return;
    $('over').classList.remove('armed');setScreen('over');
    setTimeout(()=>$('over').classList.add('armed'),500);
  },350);
}
function update(d){
  tick+=d;
  if(state!=='dead')gx=(gx+SPD*d)%24;
  if(state==='ready'||state==='menu'){bird.y=(H-GR)/2+Math.sin(tick*0.12)*8;return}
  bird.v+=GRAV*d;bird.y+=bird.v*d;
  if(state==='play'){
    spawn+=d;
    if(spawn>=95){spawn=0;pipes.push({x:W,gy:90+Math.random()*(H-GR-180-GAP),passed:false})}
    for(const p of pipes){
      p.x-=SPD*d;
      if(!p.passed&&p.x+PW<bird.x){p.passed=true;score++}
      const bx=bird.x-bird.w/2+5,bw=bird.w-10,by=bird.y-bird.h/2+5,bh=bird.h-10;
      if(bx+bw>p.x&&bx<p.x+PW&&(by<p.gy||by+bh>p.gy+GAP))die();
    }
    pipes=pipes.filter(p=>p.x>-PW-10);
    if(bird.y+bird.h/2-4>=H-GR){bird.y=H-GR-bird.h/2+4;die()}
    if(bird.y-bird.h/2<-40){bird.y=-40+bird.h/2;bird.v=0}
  }else{
    if(bird.y+bird.h/2-4>=H-GR){bird.y=H-GR-bird.h/2+4;bird.v=0}
  }
}
function pipe(p){
  const g='#73bf2e',dk='#2d4a1a',lt='#9be04a';
  function seg(x,y,w,h){ctx.fillStyle=g;ctx.fillRect(x,y,w,h);ctx.fillStyle=lt;ctx.fillRect(x+4,y,6,h);ctx.fillStyle=dk;ctx.fillRect(x,y,3,h);ctx.fillRect(x+w-3,y,3,h)}
  function cap(x,y){ctx.fillStyle=g;ctx.fillRect(x,y,PW+10,26);ctx.fillStyle=lt;ctx.fillRect(x+4,y,6,26);ctx.fillStyle=dk;ctx.fillRect(x,y,3,26);ctx.fillRect(x+PW+7,y,3,26);ctx.fillRect(x,y,PW+10,3);ctx.fillRect(x,y+23,PW+10,3)}
  seg(p.x,0,PW,p.gy-26);cap(p.x-5,p.gy-26);
  const by=p.gy+GAP;seg(p.x,by+26,PW,H-GR-by-26);cap(p.x-5,by);
}
function text(s,x,y,size,fill='#fff'){
  ctx.font=size+'px "Press Start 2P","Courier New",monospace';ctx.textAlign='center';
  ctx.lineWidth=size/3;ctx.strokeStyle='#543847';ctx.lineJoin='round';
  ctx.strokeText(s,x,y);ctx.fillStyle=fill;ctx.fillText(s,x,y);
}
function draw(){
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#70c5ce';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#8fd7df';
  for(const c of [[30,110,90],[210,70,110],[260,200,80]]){ctx.fillRect(c[0],c[1],c[2],22);ctx.fillRect(c[0]+14,c[1]-14,c[2]-40,16)}
  ctx.fillStyle='#8ed26b';ctx.fillRect(0,H-GR-40,W,40);
  for(const p of pipes)pipe(p);
  ctx.fillStyle='#ded895';ctx.fillRect(0,H-GR,W,GR);
  ctx.fillStyle='#73bf2e';ctx.fillRect(0,H-GR,W,14);
  ctx.fillStyle='#9be04a';
  for(let x=-24;x<W+24;x+=24)ctx.fillRect(x-gx,H-GR+4,12,6);
  ctx.fillStyle='#2d4a1a';ctx.fillRect(0,H-GR,W,3);
  ctx.save();ctx.translate(bird.x,bird.y);
  ctx.rotate(state==='ready'||state==='menu'?0:Math.max(-0.45,Math.min(1.2,bird.v*0.07)));
  if(img.complete&&img.naturalWidth)ctx.drawImage(img,-bird.w/2,-bird.h/2,bird.w,bird.h);
  else{ctx.fillStyle='#f7e22a';ctx.fillRect(-bird.w/2,-bird.h/2,bird.w,bird.h)}
  ctx.restore();
  if(state==='play')text(score,W/2,90,40);
  if(state==='ready'){text('Toque para voar',W/2,200,14);text('ou aperte Espaço',W/2,230,9)}
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash+')';ctx.fillRect(0,0,W,H);flash=Math.max(0,flash-0.08)}
}
function loop(now){
  const d=Math.min(2,(now-(last||now))/16.667);last=now;
  update(d);draw();requestAnimationFrame(loop);
}
reset();requestAnimationFrame(loop);
</script>
<script>
(function(){
  window.showMsg=t=>{const m=$('msg');m.textContent=t;m.style.display=t?'block':'none'};
  $('toggle').addEventListener('click',()=>{$('panel').style.display='block'});
  $('rankclose').addEventListener('click',()=>{$('panel').style.display='none'});
  $('login').addEventListener('click',()=>{
    if(!window.__rankingReady)showMsg(location.protocol==='file:'
      ?'Abra o jogo por um servidor (Live Server ou GitHub Pages). Duplo clique no arquivo não permite o login.'
      :'O ranking não carregou. Aperte F12, abra a aba Console e veja o erro.');
  });
})();
</script>
<script type="module" src="ranking.js"></script>
</body></html>
